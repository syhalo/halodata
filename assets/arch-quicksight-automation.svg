<?xml version="1.0" encoding="UTF-8"?>
<!-- 도식 내용: 스프레드시트 업로드 → S3 3단(raw·mart·pdf) → Glue/Lambda ETL → Athena → QuickSight → 분석가, 그리고 QuickSight URL trigger로 PDF를 다시 받아 운영자에게 회수하는 루프. -->
<!-- 출처: docs/design/research/landing-pg-img/architecture-8.png (AWS 공식 아이콘 + draw.io 원본 캡처)를 HALO 디자인 시스템으로 재작도. 벤더 브랜드색·한글 역할명·원본 오타(tirriger)는 제거·교정. -->
<!-- 색 근거: docs/DESIGN.md §2 토큰 — canvas #f7f6f0 / ink #15231f / body #54615a / hairline rgba(21,35,31,.12) / stage 램프 #8fbfa3→#4c9271→#3a7058→#2a5443 / 액센트 브라스 #ca9b48은 PDF 회수 루프 1지점 한정(§9-2). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="archTitle archDesc"
     font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
  <title id="archTitle">스프레드시트 인테이크 · BI 서빙 · PDF 회수 루프 아키텍처</title>
  <desc id="archDesc">운영자가 올린 스프레드시트가 S3 raw에 적재되고, Glue와 Lambda가 정제해 data mart를 만든 뒤 Athena를 거쳐 QuickSight로 서빙된다. 분석가는 대시보드를 조회하고, URL trigger로 동작하는 PDF Downloader가 리포트를 내려받아 S3에 병합 보관하면 운영자가 이를 회수한다. SNS·CloudWatch·Secrets Manager가 전 구간 운영을 받친다.</desc>

  <defs>
    <pattern id="sheetGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0 H0 V8" fill="none" stroke="rgba(21,35,31,.05)" stroke-width="1" shape-rendering="crispEdges"/>
    </pattern>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0.6 0.9 L7 4 L0.6 7.1" fill="none" stroke="#54615a" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="miter"/>
    </marker>
  </defs>

  <!-- ── 캔버스 + 도면지 그리드 ───────────────────────────────── -->
  <rect x="0" y="0" width="1200" height="632" fill="#f7f6f0"/>
  <rect x="0" y="57" width="1200" height="575" fill="url(#sheetGrid)"/>

  <!-- ── 헤더: 제목 + stage 램프 범례 ─────────────────────────── -->
  <text x="24" y="30" font-size="12.5" font-weight="600" letter-spacing="0.09em" fill="#15231f">ARCHITECTURE — SPREADSHEET INTAKE → BI SERVING → PDF RETURN</text>

  <g font-size="8.5" font-weight="500" letter-spacing="0.1em" fill="#54615a">
    <rect x="800" y="22" width="8" height="8" fill="#8fbfa3"/>
    <text x="813" y="30">01 INGEST</text>
    <rect x="898" y="22" width="8" height="8" fill="#4c9271"/>
    <text x="911" y="30">02 MODEL</text>
    <rect x="996" y="22" width="8" height="8" fill="#3a7058"/>
    <text x="1009" y="30">03 SERVE</text>
    <rect x="1090" y="22" width="8" height="8" fill="#2a5443"/>
    <text x="1103" y="30">04 OPERATE</text>
  </g>

  <line x1="24" y1="56" x2="1176" y2="56" stroke="rgba(21,35,31,.20)" stroke-width="1" shape-rendering="crispEdges"/>

  <!-- ── 클라우드 경계 ───────────────────────────────────────── -->
  <rect x="156" y="92" width="908" height="468" rx="3" fill="none" stroke="rgba(21,35,31,.20)" stroke-width="1"/>
  <rect x="168" y="108" width="8" height="8" fill="none" stroke="rgba(21,35,31,.35)" stroke-width="1"/>
  <text x="184" y="116" font-size="9.5" font-weight="600" letter-spacing="0.12em" fill="#54615a">AWS CLOUD</text>

  <!-- ── 그룹 존 (점선 = 논리적 묶음) ────────────────────────── -->
  <rect x="186" y="168" width="140" height="304" rx="3" fill="#8fbfa3" fill-opacity="0.10" stroke="rgba(21,35,31,.16)" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="186" y="152" width="6" height="6" fill="#8fbfa3"/>
  <text x="198" y="160" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#54615a">AMAZON S3</text>

  <rect x="380" y="168" width="144" height="174" rx="3" fill="#4c9271" fill-opacity="0.10" stroke="rgba(21,35,31,.16)" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="380" y="152" width="6" height="6" fill="#4c9271"/>
  <text x="392" y="160" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#54615a">DATA ETL</text>
  <rect x="450" y="148" width="68" height="14" rx="2" fill="#ece9dd" stroke="rgba(21,35,31,.12)" stroke-width="1"/>
  <text x="484" y="158.5" font-size="8" font-weight="500" letter-spacing="0.08em" fill="#54615a" text-anchor="middle">OPTIONAL</text>

  <rect x="748" y="168" width="280" height="84" rx="3" fill="#3a7058" fill-opacity="0.09" stroke="rgba(21,35,31,.16)" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="748" y="152" width="6" height="6" fill="#3a7058"/>
  <text x="760" y="160" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#54615a">QUICKSIGHT · BI</text>

  <!-- ── 엣지 (직각 오소고널) ───────────────────────────────── -->
  <g fill="none" stroke="#54615a" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#tip)">
    <path d="M130 210 H196"/>
    <path d="M314 210 H390"/>
    <!-- ETL 이 mart 를 만든다 — ETL 좌측(타일 사이 여백)에서 나와 mart 위로 내려온다.
         이전에는 raw 에서 mart 로 직결돼 있어 ETL 을 건너뛰는 것처럼 읽혔다. -->
    <path d="M392 255 H256 V272"/>
    <!-- mart 를 Athena 가 읽는다. 가로 구간이 LAMBDA 타일을 지나지만, 타일이 이 엣지 그룹보다
         뒤에 그려져 선을 덮는다 — 원본 도면과 같은 "박스 뒤로 지나가는" 표현이다. -->
    <path d="M314 300 H547 V210 H568"/>
    <path d="M700 210 H758"/>
    <path d="M1018 210 H1068" marker-start="url(#tip)"/>
    <path d="M380 430 H316"/>
    <path d="M198 430 H78 V246"/>
    <path d="M830 236 V352 H452 V402" stroke-dasharray="5 4"/>
  </g>

  <g font-size="9" font-weight="500" letter-spacing="0.04em" fill="#54615a">
    <text x="163" y="202" text-anchor="middle">upload</text>
    <text x="140" y="421" text-anchor="middle">download · pdf</text>
    <text x="816" y="346" text-anchor="end">url trigger</text>
  </g>

