  <path d="M67 210 A 11 9 0 0 1 89 210" fill="none" stroke="#15231f" stroke-width="1.3"/>
  <text x="78" y="226" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#15231f" text-anchor="middle">OPERATOR</text>
  <text x="78" y="238" font-size="8" font-weight="400" letter-spacing="0.02em" fill="#54615a" text-anchor="middle">upload · receive</text>

