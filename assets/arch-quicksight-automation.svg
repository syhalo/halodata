  <rect x="381" y="405" width="3" height="50" fill="#ca9b48"/>
  <text x="394" y="426" font-size="11.5" font-weight="600" letter-spacing="0.04em" fill="#15231f">PDF DOWNLOADER</text>
  <text x="394" y="442" font-size="9" font-weight="400" letter-spacing="0.02em" fill="#54615a">fetch · merge · store</text>

  <!-- 액센트 브라스 — 회수 루프 시작점(트리거 포트) 1지점. 노드 위에 얹도록 맨 마지막에 그린다 -->
  <circle cx="830" cy="236" r="3.5" fill="#ca9b48"/>

