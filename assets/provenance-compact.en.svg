<?xml version="1.0" encoding="UTF-8"?>
<!-- 도식 내용: 커리어 데이터가 옵시디언 마크다운(기록) → taxonomy·spec(규칙) → build_mart.py(빌드) → mart.json → 대시보드·랜딩(화면)으로 흐르는 한 줄기와, 빌드가 낸 경고가 규칙을 고쳐 다시 빌드로 돌아오는 피드백 순환을 담았다. 랜딩 Proof 캐러셀용 압축본(3~4초 노출·폭 500px 전제). -->
<!-- 상세본(provenance-flow.svg · 1200×748) 대비 축약: 노드 16종 → 5종(규칙 5카드→1개 · 소스 3종→1개 · 빌드 내부 함수 4개→0 · 루프 3카드→화살표 2줄), spec 파일명·함수명·경고 문자열·frontmatter 필드·손그림 주석 전부 삭제, AI 관여 4지점 → 1지점(기록 작성·큐레이션·규칙 보완 묶음), 본문 글자 7.5~12px → 17~34px. -->
<!-- 색 근거: docs/DESIGN.md §2 토큰 — canvas #f7f6f0 / ink #15231f / body #54615a / mute #8a958f / hairline rgba(21,35,31,.12)·strong .20 / 8px 그리드 5% / stage 램프 #8fbfa3(기록)→#4c9271(규칙)→#3a7058(빌드)→#2a5443(화면) / 브라스 #ca9b48 은 §9-2·§3-3 에 따라 피드백 순환 화살표 1곳 한정 · 텍스트 미사용. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 782" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="provcTitle provcDesc"
     font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
  <title id="provcTitle">Data Provenance (압축) — 기록 · 규칙 · 빌드 · 화면과 피드백 순환</title>
  <desc id="provcDesc">옵시디언 마크다운에 쌓인 기록이 taxonomy와 spec이 정한 규칙을 거쳐 build_mart.py로 빌드되고, mart.json 한 파일을 통해 대시보드와 랜딩 화면으로 서빙된다. AI는 기록 작성과 큐레이션, 규칙 보완에 관여한다. 빌드가 낸 경고는 규칙으로 되돌아가 규칙을 고치고, 고친 규칙으로 다시 빌드가 돌아가는 순환을 이룬다.</desc>

  <defs>
    <pattern id="provcGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0 H0 V8" fill="none" stroke="rgba(21,35,31,.05)" stroke-width="1" shape-rendering="crispEdges"/>
    </pattern>
    <marker id="provcTip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1.4 L9 5 L1 8.6" fill="none" stroke="#54615a" stroke-width="1.8" stroke-linecap="butt" stroke-linejoin="miter"/>
    </marker>
    <marker id="provcTipBrass" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1.4 L9 5 L1 8.6" fill="none" stroke="#ca9b48" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="miter"/>
    </marker>
    <marker id="provcTipBrassSm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1.4 L9 5 L1 8.6" fill="none" stroke="#ca9b48" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="miter"/>
    </marker>
  </defs>

  <!-- ── 캔버스 + 도면지 그리드 ───────────────────────────────── -->
  <rect x="0" y="0" width="1400" height="782" fill="#f7f6f0"/>
  <rect x="0" y="72" width="1400" height="710" fill="url(#provcGrid)"/>

  <!-- ── 헤더 ─────────────────────────────────────────────────── -->
  <text x="40" y="48" font-size="21" font-weight="600" letter-spacing="0.08em" fill="#15231f">DATA PROVENANCE · record → rules → build → screen</text>
  <text x="1360" y="48" font-size="17" font-weight="500" letter-spacing="0.04em" fill="#8a958f" text-anchor="end">raw → curated → mart → serving</text>
  <line x1="40" y1="72" x2="1360" y2="72" stroke="rgba(21,35,31,.20)" stroke-width="1" shape-rendering="crispEdges"/>

  <!-- ══ AI 관여 — 4지점을 1지점으로 묶었다 (기록 작성 · 큐레이션 · 규칙 보완) ══ -->
  <rect x="40" y="104" width="576" height="52" rx="4" fill="#ece9dd" fill-opacity="0.5"
        stroke="rgba(21,35,31,.35)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="60" y="117" width="46" height="26" rx="3" fill="#fffefa" stroke="rgba(21,35,31,.45)" stroke-width="1"/>
  <text x="83" y="136" font-size="18" font-weight="700" letter-spacing="0.08em" fill="#15231f" text-anchor="middle">AI</text>
  <text x="122" y="136" font-size="18" font-weight="500" fill="#15231f">writes records · curates · refines rules</text>
  <g fill="none" stroke="rgba(21,35,31,.28)" stroke-width="1.4" stroke-dasharray="4 4">
    <path d="M174 156 V176"/>
    <path d="M491 156 V176"/>
  </g>

  <!-- ══ 01 기록 — stage-1 #8fbfa3 ═══════════════════════════════ -->
  <rect x="40" y="176" width="250" height="200" rx="3" fill="#fffefa" stroke="rgba(21,35,31,.16)" stroke-width="1"/>
  <rect x="41" y="177" width="6" height="198" fill="#8fbfa3"/>
  <text x="64" y="206" font-size="17" font-weight="600" letter-spacing="0.12em" fill="#8a958f">01 · RECORD</text>
  <text x="64" y="258" font-size="34" font-weight="700" letter-spacing="0.02em" fill="#15231f">Record</text>
  <text x="64" y="300" font-size="19" font-weight="600" fill="#15231f">Obsidian markdown</text>
  <text x="64" y="332" font-size="18" font-weight="400" fill="#54615a">Human-written SSOT</text>

  <!-- ══ 02 규칙 — stage-2 #4c9271 ═══════════════════════════════ -->
  <rect x="366" y="176" width="250" height="200" rx="3" fill="#fffefa" stroke="rgba(21,35,31,.16)" stroke-width="1"/>
  <rect x="367" y="177" width="6" height="198" fill="#4c9271"/>
  <text x="390" y="206" font-size="17" font-weight="600" letter-spacing="0.12em" fill="#8a958f">02 · RULE</text>
  <text x="390" y="258" font-size="34" font-weight="700" letter-spacing="0.02em" fill="#15231f">Rules</text>
  <text x="390" y="300" font-size="19" font-weight="600" fill="#15231f">taxonomy · spec</text>
  <text x="390" y="332" font-size="18" font-weight="400" fill="#54615a">Vocabulary · schema · formulas</text>

  <!-- ══ 03 빌드 — stage-3 #3a7058 ═══════════════════════════════ -->
  <rect x="692" y="176" width="250" height="200" rx="3" fill="#fffefa" stroke="rgba(21,35,31,.16)" stroke-width="1"/>
  <rect x="693" y="177" width="6" height="198" fill="#3a7058"/>
  <text x="716" y="206" font-size="17" font-weight="600" letter-spacing="0.12em" fill="#8a958f">03 · BUILD</text>
  <text x="716" y="258" font-size="34" font-weight="700" letter-spacing="0.02em" fill="#15231f">Build</text>
  <text x="716" y="300" font-size="19" font-weight="600" fill="#15231f">build_mart.py</text>
  <text x="716" y="332" font-size="18" font-weight="400" fill="#54615a">Parse · validate · aggregate</text>

  <!-- ══ 04 화면 — stage-4 #2a5443 ═══════════════════════════════ -->
  <rect x="1110" y="176" width="250" height="200" rx="3" fill="#fffefa" stroke="rgba(21,35,31,.16)" stroke-width="1"/>
  <rect x="1111" y="177" width="6" height="198" fill="#2a5443"/>
  <text x="1134" y="206" font-size="17" font-weight="600" letter-spacing="0.12em" fill="#8a958f">04 · SERVE</text>
  <text x="1134" y="258" font-size="34" font-weight="700" letter-spacing="0.02em" fill="#15231f">Screen</text>
  <text x="1134" y="300" font-size="19" font-weight="600" fill="#15231f">Dashboard · landing</text>
  <text x="1134" y="332" font-size="18" font-weight="400" fill="#54615a">Streamlit · Plotly</text>

  <!-- ── 전진 엣지 (직각 · 중립) ─────────────────────────────── -->
  <g fill="none" stroke="#54615a" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#provcTip)">
    <path d="M290 276 H366"/>
    <path d="M616 276 H692"/>
    <path d="M942 276 H1110"/>
  </g>
  <g font-size="17" font-weight="500" letter-spacing="0.04em" fill="#54615a" text-anchor="middle">
    <text x="328" y="260">organize</text>
    <text x="654" y="260">apply</text>
  </g>

  <!-- 엣지 위의 산출물 — mart.json 한 파일이 두 트랙의 접점 -->
  <rect x="952" y="252" width="148" height="48" rx="4" fill="#fffefa" stroke="rgba(21,35,31,.20)" stroke-width="1"/>
  <text x="1026" y="283" font-size="20" font-weight="600" letter-spacing="0.02em" fill="#15231f" text-anchor="middle">mart.json</text>
  <text x="1026" y="322" font-size="17" font-weight="400" fill="#8a958f" text-anchor="middle">serving contract</text>

  <!-- ══ 피드백 순환 — 브라스 액센트는 이 두 화살표에만 (텍스트 미사용) ══ -->
  <g fill="none" stroke="#ca9b48" stroke-width="4.5" stroke-dasharray="10 6"
     stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#provcTipBrass)">
    <!-- 안쪽 U: 고친 규칙으로 다시 빌드 -->
    <path d="M534 376 V470 H785 V376"/>
    <!-- 바깥 U: 빌드가 낸 경고가 규칙으로 되돌아간다 -->
    <path d="M860 376 V584 H448 V376"/>
  </g>
  <circle cx="534" cy="376" r="5.5" fill="#ca9b48"/>
  <circle cx="860" cy="376" r="5.5" fill="#ca9b48"/>

  <!-- 순환의 메시지는 바깥 U 위에 얹는다 — 루프 선이 칩 뒤로 지나간다 -->
  <rect x="484" y="561" width="340" height="46" rx="4" fill="#fffefa" stroke="#ca9b48" stroke-width="1.6"/>
  <text x="654" y="592" font-size="20" font-weight="600" fill="#15231f" text-anchor="middle">Build warnings → rule fixes</text>
  <text x="660" y="458" font-size="19" font-weight="600" fill="#15231f" text-anchor="middle">Rebuild with the fixed rules</text>

  <!-- 순환 글리프 (비텍스트 브라스) + 루프 제목 -->
  <path d="M54 547 A13 13 0 1 1 41 560" fill="none" stroke="#ca9b48" stroke-width="3"
        stroke-linecap="butt" marker-end="url(#provcTipBrassSm)"/>
  <text x="82" y="568" font-size="23" font-weight="700" letter-spacing="0.02em" fill="#15231f">Feedback loop</text>
  <text x="82" y="598" font-size="18" font-weight="400" fill="#54615a">build → rules → build</text>

  <!-- ── 클로징 ───────────────────────────────────────────────── -->
  <line x1="40" y1="690" x2="1360" y2="690" stroke="rgba(21,35,31,.12)" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="40" y="730" font-size="19" font-weight="400" fill="#54615a">Every figure on screen derives from the markdown — no step copies it by hand.</text>
</svg>
